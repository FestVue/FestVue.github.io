<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestVue - Live TV Broadcast</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #046A38; --accent: #D4AF37; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Fullscreen Starter Overlay */
        #startOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        #startBtn { padding: 20px 40px; font-size: 1.5rem; background: var(--primary); color: #fff; border: none; border-radius: 50px; cursor: pointer; font-weight: 700; box-shadow: 0 10px 30px rgba(4, 106, 56, 0.4); transition: 0.3s; }
        #startBtn:hover { transform: scale(1.05); }

        /* Header */
        header { background: linear-gradient(135deg, var(--primary) 0%, #022c17 100%); padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; }
        .head-left h1 { font-size: 3rem; font-weight: 800; color: #fff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: -5px; }
        .head-left h1 span { color: var(--accent); }
        .head-left h2 { font-size: 1.2rem; color: #cbd5e1; font-weight: 400; text-transform: uppercase; letter-spacing: 5px; }
        .head-right { text-align: right; }
        .head-right #timeDisplay { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
        .head-right #dateDisplay { font-size: 1.2rem; color: #cbd5e1; }

        /* Slideshow Container */
        #sliderContainer { flex-grow: 1; position: relative; padding: 40px; display: flex; justify-content: center; align-items: center; }
        
        .slide { position: absolute; width: 90%; height: 85%; opacity: 0; transform: translateY(30px); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; visibility: hidden; display: flex; flex-direction: column; }
        .slide.active { opacity: 1; transform: translateY(0); pointer-events: auto; visibility: visible; }

        .slide-title { font-size: 3.5rem; font-weight: 800; text-align: center; margin-bottom: 40px; color: #fff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .slide-title span { color: var(--accent); }

        /* Leaderboard UI */
        .lb-grid { display: grid; grid-template-columns: 1fr; gap: 20px; width: 100%; max-width: 1200px; margin: 0 auto; }
        .lb-row { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 30px 50px; border-radius: 20px; font-size: 2.5rem; font-weight: 700; border-left: 10px solid var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .lb-row.rank-1 { border-left-color: #fbbf24; transform: scale(1.02); }
        .lb-row.rank-2 { border-left-color: #cbd5e1; }
        .lb-row.rank-3 { border-left-color: #b45309; }
        .lb-pts { background: rgba(255,255,255,0.1); padding: 10px 30px; border-radius: 50px; color: var(--accent); }

        /* Results UI */
        .res-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; width: 100%; }
        .res-card { background: var(--card); border-radius: 20px; padding: 30px; border-top: 8px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .res-event-title { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px dashed #334155; }
        .res-winner { display: flex; align-items: center; justify-content: space-between; font-size: 1.8rem; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; }
        .medal { font-size: 2.2rem; margin-right: 15px; }

        /* Loader */
        .loader-spinner { border: 6px solid #1e293b; border-top: 6px solid var(--accent); border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="startOverlay">
        <div class="loader-spinner" id="tvLoader"></div>
        <h2 style="margin-bottom: 30px; color: #94a3b8;" id="tvStatus">Connecting to FestVue Server...</h2>
        <button id="startBtn" style="display: none;" onclick="startBroadcast()"><i class="fas fa-play"></i> START LIVE BROADCAST</button>
        <p style="margin-top: 20px; color: #64748b; font-size: 0.9rem;">(Browser requires a click to enter Fullscreen mode)</p>
    </div>

    <header>
        <div class="head-left">
            <h1 id="tvFestName">FEST<span>VUE</span></h1>
            <h2 id="tvInstName">Loading Institution...</h2>
        </div>
        <div class="head-right">
            <div id="timeDisplay">00:00</div>
            <div id="dateDisplay">Loading Date...</div>
        </div>
    </header>

    <div id="sliderContainer">
        <!-- Slide 1: Group Standings -->
        <div id="slide-leaderboard" class="slide">
            <div class="slide-title">🏆 OVERALL <span>STANDINGS</span></div>
            <div class="lb-grid" id="lbContainer"></div>
        </div>

        <!-- Slide 2: Latest Results -->
        <div id="slide-results" class="slide">
            <div class="slide-title">📢 LATEST <span>RESULTS</span></div>
            <div class="res-grid" id="resContainer"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxy23FeTNKeZCEW2w79izuGnfz6IQ_JdKH0V1nwnc1GfKfuHUqA3zwvdpOIyo03w3T9wg/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const instId = urlParams.get('inst');

        let globalData = {};
        let currentSlideIdx = 0;
        const slides = document.querySelectorAll('.slide');
        let slideInterval;

        // 1. Clock Logic
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Fetch Data
        async function fetchTVData() {
            if(!instId) { document.getElementById('tvStatus').innerText = "⚠️ Missing ?inst= ID in URL"; document.getElementById('tvLoader').style.display='none'; return; }
            try {
                let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "fetchPublicData", instId: instId }) });
                let data = await res.json();
                if(data.status === "success") {
                    globalData = data.data;
                    document.getElementById('tvInstName').innerText = data.institutionName;
                    
                    // Parse Fest Name
                    const settings = globalData.Settings || [];
                    const festNameRow = settings.find(r => r["0"] === "CONFIG" && r["1"] === "FEST_NAME");
                    if(festNameRow) document.getElementById('tvFestName').innerHTML = festNameRow["2"];

                    renderLeaderboard();
                    renderResults();

                    // Show Start Button on first successful load
                    if(document.getElementById('startOverlay').style.display !== 'none') {
                        document.getElementById('tvLoader').style.display = 'none';
                        document.getElementById('tvStatus').style.display = 'none';
                        document.getElementById('startBtn').style.display = 'block';
                    }
                }
            } catch(e) {
                console.log("Background refresh failed, retrying on next cycle.");
            }
        }

        // 3. Render Leaderboard
        function renderLeaderboard() {
            const settings = globalData.Settings || [];
            const results = globalData.Results || [];
            const students = globalData.Students || [];
            const bonus = globalData.Bonus || [];

            // Get Points Mapping
            let defaultPts = { 1: 5, 2: 3, 3: 1 };
            let customPts = {};
            settings.filter(r => r["0"] === "POINTS").forEach(r => {
                let p = r["2"].toString().split(',');
                if(r["1"] === "DEFAULT") { defaultPts = { 1: parseInt(p[0])||0, 2: parseInt(p[1])||0, 3: parseInt(p[2])||0 }; } 
                else { customPts[r["1"]] = { 1: parseInt(p[0])||0, 2: parseInt(p[1])||0, 3: parseInt(p[2])||0 }; }
            });

            // Initialize Groups
            let groupPts = {};
            settings.filter(r => r["0"] === "GROUP").forEach(g => groupPts[g["1"]] = 0);

            // Add Bonus
            bonus.forEach(b => { if(groupPts[b["0"]] !== undefined) groupPts[b["0"]] += parseInt(b["1"] || 0); });

            // Add Result Points (Group events only count once per team per event)
            let processedGroupEvents = {}; 
            const events = globalData.Events || [];

            results.forEach(res => {
                const evCode = res["0"];
                const chestNo = res["1"];
                const pos = parseInt(res["2"]);
                const st = students.find(s => s["0"] == chestNo);
                const evDetails = events.find(e => e["0"] == evCode);
                
                if(!st || !st["5"]) return; // No group

                const ptsMap = customPts[evCode] || defaultPts;
                const points = ptsMap[pos] || 0;
                const isGroupEvent = evDetails && evDetails["4"] && evDetails["4"].toString().toLowerCase() === "group";
                
                if (isGroupEvent) {
                    const uniqueKey = `${evCode}_${pos}_${st["5"]}`; 
                    if (!processedGroupEvents[uniqueKey]) {
                        if(groupPts[st["5"]] !== undefined) groupPts[st["5"]] += points;
                        processedGroupEvents[uniqueKey] = true;
                    }
                } else {
                    if(groupPts[st["5"]] !== undefined) groupPts[st["5"]] += points;
                }
            });

            // Build HTML
            let html = "";
            let rank = 1;
            Object.entries(groupPts).sort((a,b)=>b[1]-a[1]).forEach((g, idx) => {
                let rankClass = idx === 0 ? "rank-1" : idx === 1 ? "rank-2" : idx === 2 ? "rank-3" : "";
                let medal = idx === 0 ? "🏆" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : "🔹";
                html += `<div class="lb-row ${rankClass}">
                            <div>${medal} ${g[0]}</div>
                            <div class="lb-pts">${g[1]} PTS</div>
                         </div>`;
            });
            document.getElementById('lbContainer').innerHTML = html;
        }

        // 4. Render Results
        function renderResults() {
            const results = globalData.Results || [];
            const events = globalData.Events || [];
            const students = globalData.Students || [];
            
            // Get 4 most recently published unique events
            const uniqueEventCodes = [...new Set(results.map(r => r["0"]))].reverse().slice(0, 4);
            let html = "";

            uniqueEventCodes.forEach(code => {
                const ev = events.find(e => e["0"] == code);
                const evRes = results.filter(r => r["0"] == code).sort((a,b) => a["2"] - b["2"]);
                
                if(ev) {
                    html += `<div class="res-card"><div class="res-event-title">${ev["1"]} <span style="font-size:1.2rem; color:#94a3b8;">(${ev["2"]})</span></div>`;
                    evRes.slice(0,3).forEach(r => {
                        const st = students.find(s => s["0"] == r["1"]);
                        let medal = r["2"] == 1 ? "🥇" : r["2"] == 2 ? "🥈" : "🥉";
                        let posTxt = r["2"] == 1 ? "1st" : r["2"] == 2 ? "2nd" : "3rd";
                        html += `<div class="res-winner">
                                    <div style="display:flex; align-items:center;">
                                        <span class="medal">${medal}</span> 
                                        <div><div style="font-size:1rem; color:#94a3b8; font-weight:600; line-height:1;">${posTxt} Place</div>
                                        <div style="font-weight:700;">${st ? st["1"] : "Unknown"}</div></div>
                                    </div>
                                    <div style="color:var(--accent); font-weight:700;">${st ? st["5"] : ""}</div>
                                 </div>`;
                    });
                    html += `</div>`;
                }
            });
            document.getElementById('resContainer').innerHTML = html || "<div style='grid-column: 1 / -1; text-align:center; font-size:2rem; padding: 50px; color:#64748b;'>Waiting for results to be published...</div>";
        }

        // 5. Broadcast Control
        function startBroadcast() {
            document.getElementById('startOverlay').style.display = 'none';
            // Request Fullscreen
            const elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } // Safari
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); } // IE11
            
            // Start Slideshow
            slides[0].classList.add('active');
            slideInterval = setInterval(() => {
                slides[currentSlideIdx].classList.remove('active');
                currentSlideIdx = (currentSlideIdx + 1) % slides.length;
                slides[currentSlideIdx].classList.add('active');
            }, 10000); // Swap every 10 seconds

            // Auto-refresh data every 30 seconds
            setInterval(fetchTVData, 30000);
        }

        // Listen for Exit Fullscreen (Back button / Esc)
        document.addEventListener('fullscreenchange', exitHandler);
        document.addEventListener('webkitfullscreenchange', exitHandler);
        document.addEventListener('mozfullscreenchange', exitHandler);
        function exitHandler() {
            if (!document.fullscreenElement && !document.webkitIsFullScreen && !document.mozFullScreen) {
                // Stopped fullscreen - pause slideshow and show overlay again
                clearInterval(slideInterval);
                slides.forEach(s => s.classList.remove('active'));
                document.getElementById('startOverlay').style.display = 'flex';
                document.getElementById('tvStatus').style.display = 'none';
            }
        }

        // Init
        fetchTVData();
    </script>
</body>
</html>
